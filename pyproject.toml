[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "py-nissan-leaf-obd-ble"
version = "0.1.2"
description = "Python hardware API for Nissan Leaf OBD BLE dongles (BLE + ELM327 over CAN), extracted from the Home Assistant integration."
readme = "README.md"
license = "GPL-2.0-or-later"
authors = ["Paul Butterworth <pbutterworth@gmail.com>"]
keywords = ["obd", "can", "ble", "nissan", "leaf", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering",
]
packages = [{include = "py_nissan_leaf_obd_ble", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.9"
bleak = "*"
bleak-retry-connector = "*"

[tool.poetry.urls]
Homepage = "https://github.com/pbutterworth/py-nissan-leaf-obd-ble"
Repository = "https://github.com/pbutterworth/py-nissan-leaf-obd-ble"
Issues = "https://github.com/pbutterworth/py-nissan-leaf-obd-ble/issues"
